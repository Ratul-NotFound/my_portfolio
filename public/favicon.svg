<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Premium solid dark container with sleek thin border -->
  <rect width="64" height="64" rx="16" fill="#0b0f19"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Solid Neon Cyan Typographic MHR Monogram -->
  <g fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Left Stem (Spine of M & H) -->
    <path d="M 18,16 L 18,48" />
    
    <!-- Middle Stem (Spine of M, H, & R) -->
    <path d="M 36,16 L 36,48" />
    
    <!-- M Center Chevron (Dips perfectly to the middle) -->
    <path d="M 18,16 L 27,32 L 36,16" />
    
    <!-- H Horizontal Crossbar (Links Left and Middle stems) -->
    <path d="M 18,32 L 36,32" />
    
    <!-- R Loop (Curves out cleanly to the right of the middle stem) -->
    <path d="M 36,16 C 48,16 48,32 36,32" />
    
    <!-- R Diagonal Leg (Extends down-right in absolute alignment) -->
    <path d="M 36,32 L 48,48" />
  </g>

  <!-- Glowing Constellation Junction Nodes (Solid Cyan) -->
  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="18" cy="16" r="2.2" />
    <circle cx="36" cy="16" r="2.2" />
    <circle cx="27" cy="32" r="2.2" />
    <circle cx="18" cy="32" r="2.2" />
    <circle cx="36" cy="32" r="2.2" />
    <circle cx="18" cy="48" r="2.2" />
    <circle cx="36" cy="48" r="2.2" />
    <circle cx="48" cy="48" r="2.2" />
  </g>
</svg>