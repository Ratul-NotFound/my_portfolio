<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Dark Mode Background Gradient -->
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    
    <!-- Monogram Glowing Gradient -->
    <linearGradient id="accentGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Premium rounded card container with sleek thin border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Master Typographic MHR Interlocking Monogram -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Network Circuit grid lines (subtle connectors) -->
    <path d="M 6,32 L 18,32" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2"/>
    <path d="M 46,32 L 58,32" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2"/>
    
    <!-- M & H Base Structural Pillars -->
    <path d="M 18,16 L 18,48 M 46,16 L 46,48" stroke="url(#accentGrad)" stroke-width="4.5" stroke-opacity="0.7"/>
    
    <!-- H Horizontal Crossbar -->
    <path d="M 18,32 L 46,32" stroke="url(#accentGrad)" stroke-width="4.5" stroke-opacity="0.8"/>
    
    <!-- R Elegant Loop (Curved from Spine to Crossbar) -->
    <path d="M 18,16 C 34,16 34,32 18,32" stroke="url(#accentGrad)" stroke-width="4.5" filter="url(#glow)"/>
    
    <!-- M Elegant Sweeping Wave (Flowing Dip) -->
    <path d="M 18,16 C 24,32 40,32 46,16" stroke="url(#accentGrad)" stroke-width="4.5" filter="url(#glow)"/>
    
    <!-- R Elegant Swooping Leg (Quadratic Bezier Curve) -->
    <path d="M 28,32 Q 36,40 40,48" stroke="url(#accentGrad)" stroke-width="4.5" filter="url(#glow)"/>
  </g>

  <!-- Glowing Constellation Nodes (Circuit Vertices) -->
  <g filter="url(#glow)">
    <circle cx="18" cy="16" r="2" fill="#22d3ee"/>
    <circle cx="46" cy="16" r="2" fill="#ec4899"/>
    <circle cx="32" cy="28" r="2.2" fill="#6366f1"/>
    <circle cx="18" cy="32" r="2" fill="#22d3ee"/>
    <circle cx="46" cy="32" r="2" fill="#6366f1"/>
    <circle cx="18" cy="48" r="2" fill="#22d3ee"/>
    <circle cx="46" cy="48" r="2" fill="#6366f1"/>
    <circle cx="40" cy="48" r="2" fill="#ec4899"/>
  </g>
</svg>