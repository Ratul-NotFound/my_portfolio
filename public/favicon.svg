<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Dark Mode Background Gradient -->
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    
    <!-- Monogram Glowing Gradient -->
    <linearGradient id="accentGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Premium rounded card container with sleek thin border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- MHR Interlocking Monogram Matrix -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Network Circuit grid lines (subtle connectors) -->
    <path d="M 6,32 L 18,32" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2"/>
    <path d="M 46,32 L 58,32" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2"/>
    
    <!-- Unified MHR Spine Structure (M + H base) -->
    <path d="M 18,16 L 18,48 M 46,16 L 46,48" stroke="url(#accentGrad)" stroke-width="4.5" stroke-opacity="0.75"/>
    
    <!-- M Diagonals + H Bar (interlinked center) -->
    <path d="M 18,16 L 32,31.5 L 46,16" stroke="url(#accentGrad)" stroke-width="4.5" stroke-opacity="0.85"/>
    <path d="M 18,32 L 46,32" stroke="url(#accentGrad)" stroke-width="4.5" stroke-opacity="0.85"/>
    
    <!-- R Loop & Swooping R Leg (Overlaid in high-contrast glow) -->
    <path d="M 18,16 L 33,16 C 41,16 41,32 33,32 L 18,32" stroke="url(#accentGrad)" stroke-width="4.5" filter="url(#glow)"/>
    <path d="M 32,32 L 42,48" stroke="url(#accentGrad)" stroke-width="4.5" filter="url(#glow)"/>
  </g>

  <!-- Glowing Constellation Nodes (Circuit Vertices) -->
  <g filter="url(#glow)">
    <circle cx="18" cy="16" r="2.2" fill="#22d3ee"/>
    <circle cx="46" cy="16" r="2.2" fill="#ec4899"/>
    <circle cx="32" cy="32" r="2.5" fill="#6366f1"/>
    <circle cx="18" cy="48" r="2.2" fill="#22d3ee"/>
    <circle cx="46" cy="48" r="2.2" fill="#6366f1"/>
    <circle cx="42" cy="48" r="2.2" fill="#ec4899"/>
  </g>
</svg>